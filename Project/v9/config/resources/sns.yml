SNSTopicAppointment:
  Type: AWS::SNS::Topic
  Properties:
    TopicName: ${self:service}-${self:provider.stage}-topic

SNSTopicSubscriptionTest:
  Type: AWS::SNS::Subscription
  Properties:
    Protocol: lambda
    Endpoint:
      Fn::GetAtt:
        - TestLambdaFunction
        - Arn
    TopicArn:
      Ref: SNSTopicAppointment

TestLambdaPermission:
  Type: AWS::Lambda::Permission
  Properties:
    FunctionName: !Ref TestLambdaFunction
    Principal: sns.amazonaws.com
    Action: lambda:InvokeFunction
    SourceArn: !Ref SNSTopicAppointment

SNSTopicAppointmentPolicy:
  Type: AWS::SNS::TopicPolicy
  Properties:
    Topics:
      - !Ref SNSTopicAppointment
    PolicyDocument:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource: !Ref SNSTopicAppointment

SNSTopicAppointmentSubscriptionSQSPE:
  Type: AWS::SNS::Subscription
  Properties:
    Protocol: sqs
    Endpoint:
      Fn::GetAtt:
        - SQSPE
        - Arn
    TopicArn:
      Ref: SNSTopicAppointment
    RawMessageDelivery: true
    FilterPolicy:
      countryISO:
        - PE
    FilterPolicyScope: MessageBody

PolicySQSPE:
  Type: AWS::SQS::QueuePolicy
  Properties:
    Queues:
      - !Ref SQSPE
    PolicyDocument:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt SQSPE.Arn
          Principal: "*"
          Condition:
            ArnEquals:
              aws:SourceArn: !Ref SNSTopicAppointment
  
