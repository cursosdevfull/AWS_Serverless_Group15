org: sergiohidalgocaceres
app: v1
service: appointment-v7

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, "dev"}
  iam:
    role:
      statements:
        - Action: sns:publish
          Effect: Allow
          Resource: !Ref SNSTopicAppointment
        - Action: lambda:InvokeFunction
          Effect: Allow
          Resource: "arn:aws:lambda:*:*:function:*"      
        - Action: events:PutEvents
          Effect: Allow
          Resource: "*"              

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  external:
    handler: ./src/handlers/external.handler
    environment:
      EVENT_BUSNAME: !Ref EventBus
    events:
      - http:
          path: /external
          method: post

  test:
    handler: ./src/handlers/test.handler

  appointment:
    handler: ./src/handlers/appointment.handler
    environment:
      TOPIC_ARN: !Ref SNSTopicAppointment
    events:
      - http:
          path: /appointment
          method: post

  appointmentEnrichPe:
    handler: ./src/handlers/appointment-enrich-pe.handler 
    environment:
      FUNCTION_NAME: !Ref AppointmentPeLambdaFunction
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - SQSPE  
              - Arn        
          functionResponseType: ReportBatchItemFailures                

  appointmentPe:
    handler: ./src/handlers/appointment-pe.handler 

  appointmentEnrichCl:
    handler: ./src/handlers/appointment-enrich-cl.handler    
    environment:
      FUNCTION_NAME: !Ref AppointmentClLambdaFunction    
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - SQSCL
              - Arn
          functionResponseType: ReportBatchItemFailures              

  appointmentCl:
    handler: ./src/handlers/appointment-cl.handler    

  appointmentEnrichCo:
    handler: ./src/handlers/appointment-enrich-co.handler    
    environment:
      FUNCTION_NAME: !Ref AppointmentCoLambdaFunction    
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - SQSCO
              - Arn
          functionResponseType: ReportBatchItemFailures

  appointmentCo:
    handler: ./src/handlers/appointment-co.handler    

  appointmentEnrichMx:
    handler: ./src/handlers/appointment-enrich-mx.handler    
    environment:
      FUNCTION_NAME: !Ref AppointmentMxLambdaFunction    
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - SQSMX
              - Arn
          functionResponseType: ReportBatchItemFailures              

  appointmentMx:
    handler: ./src/handlers/appointment-mx.handler    

resources:
  Resources:
    SNSTopicAppointment:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-topic

    SNSTopicSubscriptionTest:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: lambda
        Endpoint:
          Fn::GetAtt:
            - TestLambdaFunction
            - Arn
        TopicArn:
          Ref: SNSTopicAppointment

    TestLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref TestLambdaFunction
        Principal: sns.amazonaws.com
        Action: lambda:InvokeFunction
        SourceArn: !Ref SNSTopicAppointment

    SNSTopicAppointmentPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref SNSTopicAppointment
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sns:Publish
              Resource: !Ref SNSTopicAppointment

    SNSTopicAppointmentSubscriptionSQSPE:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint:
          Fn::GetAtt:
            - SQSPE
            - Arn
        TopicArn:
          Ref: SNSTopicAppointment
        RawMessageDelivery: true
        FilterPolicy:
          countryISO:
            - PE
        FilterPolicyScope: MessageBody
    
    PolicySQSPE:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SQSPE
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SQSPE.Arn
              Principal: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SNSTopicAppointment
      
    SNSTopicAppointmentSubscriptionSQSCO:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint:
          Fn::GetAtt:
            - SQSCO
            - Arn
        TopicArn:
          Ref: SNSTopicAppointment
        RawMessageDelivery: true
        FilterPolicy:
          countryISO:
            - CO
        FilterPolicyScope: MessageBody
    
    PolicySQSCO:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SQSCO
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SQSCO.Arn
              Principal: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SNSTopicAppointment
      
    SNSTopicAppointmentSubscriptionSQSCL:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint:
          Fn::GetAtt:
            - SQSCL
            - Arn
        TopicArn:
          Ref: SNSTopicAppointment
        RawMessageDelivery: true
        FilterPolicy:
          countryISO:
            - CL
        FilterPolicyScope: MessageBody
    
    PolicySQSCL:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SQSCL
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SQSCL.Arn
              Principal: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SNSTopicAppointment

    SNSTopicAppointmentSubscriptionSQSMX:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint:
          Fn::GetAtt:
            - SQSMX
            - Arn
        TopicArn:
          Ref: SNSTopicAppointment
        RawMessageDelivery: true
        FilterPolicy:
          countryISO:
            - MX
        FilterPolicyScope: MessageBody
    
    PolicySQSMX:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SQSMX
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SQSMX.Arn
              Principal: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SNSTopicAppointment

    SQSDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-sqs-dlq
        VisibilityTimeout: 300   

    SQSPE:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-sqs-pe
        VisibilityTimeout: 10
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - SQSDLQ
              - Arn
          maxReceiveCount: 1

    SQSCO:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-sqs-co
        VisibilityTimeout: 10
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - SQSDLQ
              - Arn
          maxReceiveCount: 1

    SQSCL:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-sqs-cl
        VisibilityTimeout: 10
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - SQSDLQ
              - Arn
          maxReceiveCount: 1  

    SQSMX:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-sqs-mx
        VisibilityTimeout: 10
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - SQSDLQ
              - Arn
          maxReceiveCount: 1  

    EventBridgeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: "sts:AssumeRole"
        Path: /
        Policies:
          - PolicyName: PublishMessage
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action: 
                    - "sns:publish"
                  Resource: !Ref SNSTopicAppointment                  

    EventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:service}-${self:provider.stage}-event-bus
    
    Rule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: !Ref EventBus
        EventPattern:
          source:
            - "web-app"
            - "mobile-app"
            - "desktop-app"
          "detail-type":
            - "appointment-create"
            - "appointment-cancel"
        Targets:
          - Arn:
              Fn::GetAtt:
                - SNSTopicAppointment
                - TopicArn
            Id: "DestinationCustom"
            RoleArn:
              Fn::GetAtt:
                - EventBridgeRole
                - Arn
            InputTransformer:
              InputPathsMap:
                slotId: "$.detail.slotId"
                patientId: "$.detail.patientId"
                date: "$.detail.date"
                countryISO: "$.detail.countryISO"
              InputTemplate: '{"slotId": <slotId>, "patientId": <patientId>, "date": "<date>", "countryISO": "<countryISO>"}'

    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-topic-alarm

    AlarmTopicSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: email
        Endpoint: sergiohidalgocaceres@gmail.com
        TopicArn:
          Ref: AlarmTopic

    Alarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-alarm-error
        MetricName: NumberOfMessagesReceived
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:service}-${self:provider.stage}-sqs-dlq
        Statistic: Sum
        Period: 10
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic